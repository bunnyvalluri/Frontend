<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html lang="en">
<!-- Container for document metadata (charset, viewport, title, stylesheets, scripts) -->
<head>
  <!-- Sets character encoding to UTF-8 for universal character & symbol support -->
  <meta charset="UTF-8">
  <!-- Configures responsive viewport scaling for mobile and desktop screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Defines the webpage title displayed on the browser tab and bookmarks -->
  <title>Document</title>
<!-- Closes the metadata <head> section -->
</head>
<!-- Container for all visible content rendered in the web browser -->
<body>
  <!-- Contact information element for the author or owner of the document -->
  <address>
Written by <a href="mailto:webmaster@example.com">Jon Doe</a>.<br>
Visit us at:<br>
Example.com<br>
Box 564, Disneyland<br>
USA
<!-- Closes the <address> element -->
</address>
<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
