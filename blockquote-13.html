<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The blockquote element</h1>

<!-- Paragraph element: represents a block of standard body text -->
<p>Here is a quote from WWF's website:</p>

<!-- Block quotation element: displays an extended quoted section indented from surrounding text -->
<blockquote cite="http://www.worldwildlife.org/who/index.html">
For 50 years, WWF has been protecting the future of nature. The world's leading conservation organization, WWF works in 100 countries and is supported by 1.2 million members in the United States and close to 5 million globally.
<!-- Closes the <blockquote> element -->
</blockquote>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
