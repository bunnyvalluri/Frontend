<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!doctype html>
<!-- Root container element for the entire HTML document -->
<html>
  <!-- Container for all visible content rendered in the web browser -->
  <body>
    <!-- Level 1 Heading: primary main title of the page/section -->
    <h1>The button Element</h1>

    <!-- Interactive clickable button for triggering form submissions or JavaScript actions -->
    <button type="button" onclick="alert('Hello world!')">Click Me!</button>

    <!-- Closes the visible <body> content section -->
  </body>
  <!-- Closes the root HTML document -->
</html>
