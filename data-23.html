<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The data element</h1>

<!-- Paragraph element: represents a block of standard body text -->
<p>The following example displays product names but also associates each name with a product number:</p>

<!-- Unordered list container: renders a bulleted list of items -->
<ul>
  <!-- List item element inside ordered `<ol>` or unordered `<ul>` lists -->
  <li><data value="21053">Cherry Tomato</data></li>
  <!-- List item element inside ordered `<ol>` or unordered `<ul>` lists -->
  <li><data value="21054">Beef Tomato</data></li>
  <!-- List item element inside ordered `<ol>` or unordered `<ul>` lists -->
  <li><data value="21055">Snack Tomato</data></li>
<!-- Closes the <ul> element -->
</ul>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
