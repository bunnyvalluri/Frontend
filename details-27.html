<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The details element</h1>

<!-- Interactive disclosure widget: can be toggled open or closed by the user -->
<details>
  <!-- Summary label: visible, clickable heading that toggles a `<details>` element -->
  <summary>Epcot Center</summary>
  <!-- Paragraph element: represents a block of standard body text -->
  <p>Epcot is a theme park at Walt Disney World Resort featuring exciting attractions, international pavilions, award-winning fireworks and seasonal special events.</p>
<!-- Closes the <details> element -->
</details>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
