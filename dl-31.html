<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The dl, dd, and dt elements</h1>

<!-- Paragraph element: represents a block of standard body text -->
<p>These three elements are used to create a description list:</p>

<!-- Description list container: pairs terms (`<dt>`) with descriptions (`<dd>`) -->
<dl>
  <!-- Definition term: specifies a term/name in a description list -->
  <dt>Coffee</dt>
  <!-- Description / definition text corresponding to a term inside a description list `<dl>` -->
  <dd>Black hot drink</dd>
  <!-- Definition term: specifies a term/name in a description list -->
  <dt>Milk</dt>
  <!-- Description / definition text corresponding to a term inside a description list `<dl>` -->
  <dd>White cold drink</dd>
<!-- Closes the <dl> element -->
</dl>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
