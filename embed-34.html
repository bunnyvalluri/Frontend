<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The embed element</h1>

<!-- Embeds external interactive content or third-party multimedia plugins -->
<embed type="image/jpg" src="https://www.bing.com/th/id/OIP.fV-OZpn6Jtc6NUpSIqRwxQHaE7?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2" width="300" height="200">

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
