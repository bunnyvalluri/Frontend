<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The figure and figcaption element</h1>

<!-- Self-contained figure container for images, diagrams, photos, or code listings -->
<figure>
  <!-- Image element: embeds a graphic via src URL, dimensions, and alternative text -->
  <img src="https://www.bing.com/th/id/OIP.HyPO0GQqnsGoMcauAHz_MQHaE7?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2" alt="Trulli" style="width:100%">
  <!-- Caption / legend for a `<figure>` illustration or image -->
  <figcaption>Fig.1 - Trulli, Puglia, Italy.</figcaption>
<!-- Closes the <figure> element -->
</figure>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
