<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>This is heading 1</h1>
<!-- Level 2 Heading: major subsection title -->
<h2>This is heading 2</h2>
<!-- Level 3 Heading: sub-topic heading -->
<h3>This is heading 3</h3>
<!-- Level 4 Heading: minor subsection heading -->
<h4>This is heading 4</h4>
<!-- Level 5 Heading: small heading -->
<h5>This is heading 5</h5>
<!-- Level 6 Heading: lowest level heading -->
<h6>This is heading 6</h6>

<!-- Paragraph element: represents a block of standard body text -->
<p><b>Tip:</b> Use h1 to h6 elements only for headings. Do not use them just to make text bold or big. Use other tags for that.</p>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
