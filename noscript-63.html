<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The noscript element</h1>

<!-- Paragraph element: represents a block of standard body text -->
<p>A browser with JavaScript disabled will show the text inside the noscript element ("Hello World!" will not be displayed).</p>

<!-- JavaScript block for client-side interactivity -->
<script>
document.write("Hello World!")
<!-- Closes the JavaScript block -->
</script>
<!-- Fallback content shown to users when JavaScript is disabled in their browser -->
<noscript>Sorry, your browser does not support JavaScript!</noscript>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
