<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html lang="en">
<!-- Container for document metadata (charset, viewport, title, stylesheets, scripts) -->
<head>
  <!-- Sets character encoding to UTF-8 -->
  <meta charset="UTF-8">
  <!-- Configures responsive mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Defines page title -->
  <title>The q Element</title>
</head>
<!-- Container for all visible content rendered in the web browser -->
<body>
  <!-- Level 1 Heading -->
  <h1>The q element</h1>
  <!-- Paragraph with inline short quotation tag <q> -->
  <p>WWF's goal is to: <q>Build a future where people live in harmony with nature.</q></p>
<!-- Closes visible body -->
</body>
<!-- Closes root document -->
</html>
