<!-- Document type declaration: tells the browser to render the page using the modern HTML5 standard -->
<!DOCTYPE html>
<!-- Root container element for the entire HTML document -->
<html>
<!-- Container for all visible content rendered in the web browser -->
<body>

<!-- Level 1 Heading: primary main title of the page/section -->
<h1>The source element</h1>

<!-- Paragraph element: represents a block of standard body text -->
<p>Click on the play button to play a sound:</p>

<!-- Embeds audio content with playback controls (play, pause, volume) -->
<audio controls>
  <!-- Media source: specifies alternate media files and MIME types for audio/video/picture -->
  <source src="horse.ogg" type="audio/ogg">
  <!-- Media source: specifies alternate media files and MIME types for audio/video/picture -->
  <source src="horse.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
<!-- Closes the <audio> element -->
</audio>

<!-- Closes the visible <body> content section -->
</body>
<!-- Closes the root HTML document -->
</html>
